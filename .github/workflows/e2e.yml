name: E2E

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  debate-e2e:
    name: debate fake-backed e2e
    runs-on: ubuntu-latest
    # Cap the whole job so a hung image build or stuck container can't run the
    # runner indefinitely (the per-step health wait only covers startup).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Build + start the full stack (postgres, minio, migrate, app) with
      # DEBATE_REFINER_MODE=fake (set in docker-compose.test.yml), so the
      # debate refiners return canned output and no provider API keys are
      # needed. The app is published on :8081.
      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/health || true)
            if [ "$code" = "200" ]; then echo "app healthy"; exit 0; fi
            sleep 3
          done
          echo "::error::app did not become healthy on :8081"
          docker compose -f docker-compose.test.yml logs app
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # One invocation for the whole set. Global setup registers the single
      # account the app permits (registration is first-user-only) and shares
      # its session, so specs no longer compete for that one slot and no
      # longer need a database reset between them (#136).
      #
      # Specs not listed here are not yet migrated off self-registration and
      # would fail; they are tracked in #136 rather than silently skipped.
      - name: Run migrated e2e specs
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
        run: |
          npx playwright test \
            02-dashboard-orgs.spec.js \
            03-projects.spec.js \
            04-tickets.spec.js \
            05-admin.spec.js \
            06-ticket-detail.spec.js \
            12-debate-fake.spec.js

      - name: App logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs app
